<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backtalk — transcript</title>
<style>
  :root {
    --page-plane:     #0d0d0d;
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:         rgba(255,255,255,0.10);

    --you-accent:      #c3c2b7;
    --you-row-bg:      rgba(255,255,255,0.03);
    --samantha-accent: #3987e5;
    --samantha-text:   #7fb4f2;
    --samantha-row-bg: rgba(57,135,229,0.05);

    --ok:   #199e70;
    --bad:  #e66767;

    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--page-plane);
    font-family: var(--font-sans);
    color: var(--text-primary);
  }
  body {
    display: flex; flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-1);
  }
  header h1 {
    font-size: 14px; font-weight: 600; margin: 0;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    flex: 0 0 auto;
    transition: background 200ms ease;
  }
  #dot.ok { background: var(--ok); }
  #dot.bad { background: var(--bad); }

  .status-pill {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--text-secondary);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .hangup-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 11.5px;
    padding: 3px 12px;
    cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
  }
  .hangup-btn:hover {
    color: var(--bad);
    border-color: var(--bad);
    background: rgba(230, 103, 103, 0.08);
  }

  #idleView {
    margin: auto;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
  }
  .idle-msg { color: var(--text-muted); font-size: 14px; }
  .idle-error { color: var(--bad); font-size: 13px; max-width: 360px; text-align: center; }
  .start-btn {
    background: var(--samantha-accent);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 28px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .start-btn:disabled { opacity: 0.6; cursor: default; }
  .start-btn:hover:not(:disabled) { filter: brightness(1.1); }

  .settings-wrap { position: relative; }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 4px; line-height: 0;
    border-radius: 5px;
    transition: color 120ms ease, background 120ms ease;
  }
  .icon-btn:hover { color: var(--text-primary); background: var(--surface-2); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }

  .settings-panel {
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-width: 260px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 10;
  }
  .settings-panel[hidden] { display: none; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .toggle { position: relative; display: inline-block; flex: 0 0 auto; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle-track {
    display: block; width: 32px; height: 18px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    position: relative; transition: background 150ms ease;
  }
  .toggle-knob {
    position: absolute; top: 1px; left: 1px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-muted);
    transition: transform 150ms ease, background 150ms ease;
  }
  .toggle input:checked + .toggle-track { background: var(--samantha-accent); border-color: var(--samantha-accent); }
  .toggle input:checked + .toggle-track .toggle-knob { transform: translateX(14px); background: #fff; }

  .settings-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .settings-label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .model-btns { display: flex; gap: 6px; }
  .voice-btns { flex-wrap: wrap; }
  .volume-row { display: flex; align-items: center; gap: 10px; }
  .volume-row input[type="range"] { flex: 1 1 auto; accent-color: var(--samantha-accent); }
  .volume-value { flex: 0 0 auto; min-width: 3.2em; text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .model-btn {
    flex: 1 1 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 0;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .model-btn:hover { color: var(--text-primary); border-color: var(--samantha-accent); }
  .model-btn.sent { color: var(--ok); border-color: var(--ok); }
  .model-btn.active {
    color: var(--samantha-accent);
    border-color: var(--samantha-accent);
    background: var(--samantha-row-bg);
  }

  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }

  /* Off by default: rows always left-aligned regardless of speaker.
     The settings toggle flips your own messages to the right, same
     idea as the original chat-bubble layout, without touching
     anything else about the row (font, tag, border). */
  #log.align-you-right .row.you { flex-direction: row-reverse; }
  #log.align-you-right .row.you .text { text-align: right; }

  /* Log-line rows, not chat bubbles: always left-aligned, full width,
     a tag like the real backtalk.log lines ("[you]", "[sam]" -- shown
     short here even though the underlying speaker id stays
     "samantha"), segregated by a left border + faint background tint
     per speaker instead of by which side of the screen the row sits
     on. */
  .row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 18px 7px 15px;
    border-left: 3px solid transparent;
  }
  .row.you {
    border-left-color: var(--you-accent);
    background: var(--you-row-bg);
  }
  .row.samantha {
    border-left-color: var(--samantha-accent);
    background: var(--samantha-row-bg);
  }
  .tag {
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    padding-top: 1px;
  }
  .row.you .tag { color: var(--text-secondary); }
  .row.samantha .tag { color: var(--samantha-accent); }
  .text {
    flex: 1 1 auto;
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: var(--text-primary);
  }
  .row.samantha .text { color: var(--samantha-text); }
  .text a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: currentColor;
    opacity: 0.85;
  }
  .text a:hover { opacity: 1; }
  .text code {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.92em;
  }
  .text pre {
    margin: 6px 0;
    padding: 10px 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow-x: auto;
  }
  .text pre code {
    background: none;
    padding: 0;
    border-radius: 0;
  }

  #empty {
    margin: auto;
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
  }

  footer {
    flex: 0 0 auto;
    display: flex; gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface-1);
  }
  #input {
    flex: 1 1 auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    padding: 10px 12px;
    resize: none;
    outline: none;
  }
  #input:focus { border-color: var(--samantha-accent); }
  #send {
    flex: 0 0 auto;
    background: var(--samantha-accent);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 0 20px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  #send:hover:not(:disabled) { filter: brightness(1.1); }

  /* Two small dots, fixed outside the header/footer so they stay
     reachable even when chrome-hidden removes both bars. Top-right,
     not top-left: rows are left-aligned by default, so the right edge
     of the log is the part least likely to ever have message text
     under it. Sits below the header when it's visible; snaps to the
     true top-right corner once the header's gone. The dark backing
     chip keeps them legible against a long line that wraps underneath
     anyway, without needing to raise the resting opacity further. */
  .tiny-toggles {
    position: fixed;
    top: 56px; right: 8px;
    display: flex; gap: 6px;
    padding: 3px 4px;
    border-radius: 999px;
    background: rgba(0,0,0,0.35);
    z-index: 50;
    opacity: 0.35;
    transition: opacity 150ms ease, top 150ms ease;
  }
  body.chrome-hidden .tiny-toggles { top: 6px; }
  .tiny-toggles:hover { opacity: 0.9; }
  .tiny-toggle-btn {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: none;
    background: var(--text-muted);
    cursor: pointer;
    padding: 0;
  }
  .tiny-toggle-btn.active { background: var(--samantha-accent); }

  body.chrome-hidden header,
  body.chrome-hidden footer { display: none; }
  /* Scrollbar hides together with the bars, but #log stays scrollable. */
  body.chrome-hidden #log {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  body.chrome-hidden #log::-webkit-scrollbar { display: none; }

  #log.no-row-bg .row {
    background: none;
    border-left-color: transparent;
  }
</style>
<script>
/* Omarchy theme bridge — fetches this page's generated CSS
   (~/workstation/backtalk-transcript-theme/) directly from the local
   bridge server, instead of relying on the browser extension's
   chrome.scripting injection. Extensions don't reach every renderer
   (Television's Electron webview, in particular) — a page-level fetch
   does, since it's just an ordinary same-machine HTTP request. Same
   snippet as ai-visualizer/faces/radial/index.html; see that file's
   comment for the full token-exposure rationale (confirmed acceptable
   by Des, 2026-09-01, for this same-user, localhost-only, read-only
   setup). Colors only — the layout, right-align toggle, settings menu,
   and everything else built today is untouched; only the :root custom
   property VALUES change underneath it. */
(function () {
  "use strict";
  var BRIDGE_ENDPOINT = "http://127.0.0.1:9847/v1/style";
  var BRIDGE_TOKEN = "a3a5798636584b2e6b5bc5d5b2d8853475080cbc5e8b4b8e53559f1f948de335";
  var POLL_MS = 2000;
  var styleEl = null;
  var lastRevision = null;

  function applyTheme() {
    var url = BRIDGE_ENDPOINT
      + "?hostname=" + encodeURIComponent(location.host.toLowerCase())
      + "&pathname=" + encodeURIComponent(location.pathname);
    fetch(url, {
      cache: "no-store",
      headers: { "X-Omarchy-Bridge-Token": BRIDGE_TOKEN }
    }).then(function (r) {
      if (!r.ok) throw new Error("bridge HTTP " + r.status);
      return r.json();
    }).then(function (data) {
      if (data.revision === lastRevision) return;
      lastRevision = data.revision;
      if (!styleEl) {
        styleEl = document.createElement("style");
        styleEl.id = "omarchy-bridge-theme";
        document.head.appendChild(styleEl);
      }
      styleEl.textContent = data.css;
    }).catch(function () {
      // No bridge reachable (viewed off this machine, bridge not
      // running, etc.) — leave whatever's already applied, never
      // break the page over this.
    });
  }

  applyTheme();
  setInterval(applyTheme, POLL_MS);
})();
</script>
</head>
<body>
  <header>
    <span id="dot"></span>
    <h1>backtalk transcript</h1>
    <span id="statusPill" class="status-pill">—</span>
    <button id="hangupBtn" class="hangup-btn" type="button" hidden>Hang Up</button>
    <div class="settings-wrap">
      <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M2 4.5h12M2 8h12M2 11.5h12"/>
        </svg>
      </button>
      <div id="settingsPanel" class="settings-panel" hidden>
        <label class="settings-row">
          <span>Right-align your messages</span>
          <span class="toggle">
            <input type="checkbox" id="alignToggle">
            <span class="toggle-track"><span class="toggle-knob"></span></span>
          </span>
        </label>
        <div class="settings-section">
          <div class="settings-label">Model</div>
          <div class="model-btns">
            <button class="model-btn" type="button" data-tier="fast" data-phrase="switch to the fast model">Fast</button>
            <button class="model-btn" type="button" data-tier="deep" data-phrase="switch to the deep model">Deep</button>
            <button class="model-btn" type="button" data-tier="cheap" data-phrase="switch to the cheap model">Cheap</button>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label">Reasoning effort</div>
          <div class="model-btns">
            <button class="model-btn" type="button" data-effort="low" data-phrase="set effort to low">Low</button>
            <button class="model-btn" type="button" data-effort="medium" data-phrase="set effort to medium">Med</button>
            <button class="model-btn" type="button" data-effort="high" data-phrase="set effort to high">High</button>
            <button class="model-btn" type="button" data-effort="xhigh" data-phrase="set effort to xhigh">XHi</button>
            <button class="model-btn" type="button" data-effort="max" data-phrase="set effort to max">Max</button>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label">Engine</div>
          <div class="model-btns">
            <button class="model-btn" type="button" data-engine="cartesia" data-phrase="switch to cartesia voice">Cartesia</button>
            <button class="model-btn" type="button" data-engine="pocket" data-phrase="switch to pocket voice">Pocket TTS</button>
            <button class="model-btn" type="button" data-engine="chatterbox" data-phrase="switch to chatterbox voice">Chatterbox</button>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label">Voice</div>
          <div class="model-btns voice-btns">
            <button class="model-btn" type="button" data-voice="samantha" data-phrase="switch voice to samantha">Sam</button>
            <button class="model-btn" type="button" data-voice="niel" data-phrase="switch voice to niel">Niel</button>
            <button class="model-btn" type="button" data-voice="zoi" data-phrase="switch voice to zoi">Zoi</button>
            <button class="model-btn" type="button" data-voice="bok" data-phrase="switch voice to bok">Bok</button>
            <button class="model-btn" type="button" data-voice="aur" data-phrase="switch voice to aur">Aur</button>
            <button class="model-btn" type="button" data-voice="fria" data-phrase="switch voice to fria">Fria</button>
            <button class="model-btn" type="button" data-voice="elliot" data-phrase="switch voice to elliot">Elliot</button>
            <button class="model-btn" type="button" data-voice="hal" data-phrase="switch voice to hal">Hal</button>
            <button class="model-btn" type="button" data-voice="tars" data-phrase="switch voice to tars">TARS</button>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label">Volume</div>
          <div class="volume-row">
            <input type="range" id="volumeSlider" min="0" max="300" step="5" value="100">
            <span id="volumeValue" class="volume-value">100%</span>
          </div>
        </div>
        <div class="settings-section">
          <label class="settings-row">
            <span>Auto-approve (stop asking for permission)</span>
            <span class="toggle">
              <input type="checkbox" id="autoApproveToggle">
              <span class="toggle-track"><span class="toggle-knob"></span></span>
            </span>
          </label>
        </div>
      </div>
    </div>
  </header>

  <div id="log"><div id="empty">Waiting for the conversation to start…</div></div>

  <footer>
    <textarea id="input" rows="1" placeholder="Type a message — same as speaking"></textarea>
    <button id="send">Send</button>
  </footer>

  <div class="tiny-toggles">
    <button id="chromeToggleDot" class="tiny-toggle-btn" type="button" title="Hide top/bottom bars"></button>
    <button id="rowBgToggleDot" class="tiny-toggle-btn" type="button" title="Hide row background"></button>
  </div>

<script>
(function () {
  "use strict";
  var logEl = document.getElementById("log");
  var emptyEl = document.getElementById("empty");
  var dotEl = document.getElementById("dot");
  var inputEl = document.getElementById("input");
  var sendEl = document.getElementById("send");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsPanel = document.getElementById("settingsPanel");
  var alignToggle = document.getElementById("alignToggle");
  var statusPill = document.getElementById("statusPill");
  var autoApproveToggle = document.getElementById("autoApproveToggle");
  var volumeSlider = document.getElementById("volumeSlider");
  var volumeValue = document.getElementById("volumeValue");
  var hangupBtn = document.getElementById("hangupBtn");
  var chromeToggleDot = document.getElementById("chromeToggleDot");
  var rowBgToggleDot = document.getElementById("rowBgToggleDot");

  // Television's desktop client injects this global into every URL
  // artifact webview it renders (contextIsolation is off for those, so
  // it lands directly in scope here) -- confirmed against the live
  // @telepath-computer/television-desktop preload, not guessed. Lets
  // the launch chain later tell "already open in Television" apart
  // from "already open in a plain browser tab" instead of guessing
  // from window-manager state alone.
  var POLL_SOURCE = (typeof window.__televisionContentBridge !== "undefined")
    ? "television" : "browser";

  var since = 0;
  var bootId = null;
  var isIdle = null;   // null = not known yet; true/false once a poll answers
  var pinnedToBottom = true;
  var startBtnEl = null, idleErrorEl = null;
  var startPending = false;      // true from click until active, a
                                  // reported failure, or a timeout
  var startClickedAt = null;
  var lastReportedFailed = false;
  var START_TIMEOUT_MS = 20000;

  hangupBtn.addEventListener("click", function () {
    postInput("end voice mode");
  });

  function showIdleView() {
    if (isIdle === true) return;   // already showing it -- don't rebuild/flicker
    isIdle = true;
    logEl.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.id = "idleView";
    var msg = document.createElement("div");
    msg.className = "idle-msg";
    msg.textContent = "No active voice session.";
    idleErrorEl = document.createElement("div");
    idleErrorEl.className = "idle-error";
    idleErrorEl.hidden = true;
    startBtnEl = document.createElement("button");
    startBtnEl.type = "button";
    startBtnEl.className = "start-btn";
    startBtnEl.textContent = "Start Call";
    startBtnEl.addEventListener("click", startCall);
    wrap.appendChild(msg);
    wrap.appendChild(idleErrorEl);
    wrap.appendChild(startBtnEl);
    logEl.appendChild(wrap);
    emptyEl = null;
    statusPill.textContent = "Idle";
    hangupBtn.hidden = true;
    inputEl.disabled = true;
    inputEl.placeholder = "No active call";
    sendEl.disabled = true;
  }

  function startCall() {
    if (!startBtnEl) return;
    startBtnEl.disabled = true;
    startBtnEl.textContent = "Starting…";
    if (idleErrorEl) idleErrorEl.hidden = true;
    startPending = true;
    startClickedAt = Date.now();
    lastReportedFailed = false;
    // No need to wait on this or poll for completion -- the existing
    // 300ms poll loop picks up the real session (and flips back to
    // the active view) the moment it comes up, a reported
    // launch_failed the moment the launcher sees the chain die, or a
    // client-side timeout below if neither of those ever fires.
    fetch("/start", { method: "POST" }).catch(function () {});
  }

  function resetStartButton(message) {
    startPending = false;
    startClickedAt = null;
    if (startBtnEl) {
      startBtnEl.disabled = false;
      startBtnEl.textContent = "Start Call";
    }
    if (idleErrorEl) {
      idleErrorEl.textContent = message;
      idleErrorEl.hidden = !message;
    }
  }

  function showActiveView() {
    if (isIdle === false) return;
    isIdle = false;
    resetLog();
    hangupBtn.hidden = false;
    inputEl.disabled = false;
    inputEl.placeholder = "Type a message — same as speaking";
    sendEl.disabled = false;
    startPending = false;
    startClickedAt = null;
    lastReportedFailed = false;
  }

  var ALIGN_KEY = "backtalk-transcript-align-you-right";
  try {
    if (localStorage.getItem(ALIGN_KEY) === "1") {
      logEl.classList.add("align-you-right");
      alignToggle.checked = true;
    }
  } catch (e) {}

  settingsBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    settingsPanel.hidden = !settingsPanel.hidden;
  });
  document.addEventListener("click", function (e) {
    if (!settingsPanel.hidden && !settingsPanel.contains(e.target)) {
      settingsPanel.hidden = true;
    }
  });
  alignToggle.addEventListener("change", function () {
    logEl.classList.toggle("align-you-right", alignToggle.checked);
    try {
      localStorage.setItem(ALIGN_KEY, alignToggle.checked ? "1" : "0");
    } catch (e) {}
  });

  var CHROME_KEY = "backtalk-transcript-chrome-hidden";
  var ROWBG_KEY = "backtalk-transcript-no-row-bg";
  try {
    if (localStorage.getItem(CHROME_KEY) === "1") {
      document.body.classList.add("chrome-hidden");
      chromeToggleDot.classList.add("active");
    }
    if (localStorage.getItem(ROWBG_KEY) === "1") {
      logEl.classList.add("no-row-bg");
      rowBgToggleDot.classList.add("active");
    }
  } catch (e) {}

  chromeToggleDot.addEventListener("click", function () {
    var on = document.body.classList.toggle("chrome-hidden");
    chromeToggleDot.classList.toggle("active", on);
    try { localStorage.setItem(CHROME_KEY, on ? "1" : "0"); } catch (e) {}
  });

  rowBgToggleDot.addEventListener("click", function () {
    var on = logEl.classList.toggle("no-row-bg");
    rowBgToggleDot.classList.toggle("active", on);
    try { localStorage.setItem(ROWBG_KEY, on ? "1" : "0"); } catch (e) {}
  });

  function resetLog() {
    logEl.innerHTML = "";
    emptyEl = document.createElement("div");
    emptyEl.id = "empty";
    emptyEl.textContent = "Waiting for the conversation to start…";
    logEl.appendChild(emptyEl);
  }

  logEl.addEventListener("scroll", function () {
    var gap = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight;
    pinnedToBottom = gap < 40;
  });

  function tagFor(speaker) {
    return speaker === "you" ? "[you]" : "[sam]";
  }

  // Minimal, dependency-free markdown -> HTML for transcript lines.
  // Escapes raw text first so nothing in a transcript line (tool
  // output, error text, anything) can inject markup, then layers on
  // a handful of safe, well-scoped transforms. Code/link spans are
  // pulled out into placeholders before bold/italic run, so those
  // regexes never reach inside a URL or a code span.
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // "\uE000" is a Unicode Private Use Area codepoint -- it can't
  // occur in ordinary transcript text, so wrapping a placeholder
  // index in it is safe against collisions.
  var PLACEHOLDER_MARK = "\uE000";

  function markdownToHtml(raw) {
    var placeholders = [];
    function stash(html) {
      placeholders.push(html);
      return PLACEHOLDER_MARK + (placeholders.length - 1) + PLACEHOLDER_MARK;
    }

    var s = escapeHtml(raw);

    // Fenced code blocks: ```lang\ncode``` (lang is ignored -- no
    // syntax highlighter here, just a monospace block).
    s = s.replace(/```[a-zA-Z0-9_+-]*\n?([\s\S]*?)```/g, function (_, code) {
      return stash("<pre><code>" + code.replace(/\n$/, "") + "</code></pre>");
    });

    // Inline code spans.
    s = s.replace(/`([^`\n]+)`/g, function (_, code) {
      return stash("<code>" + code + "</code>");
    });

    // Markdown links: [text](https://...). target=_blank is safe even
    // inside Television's embedded webview -- its Electron shell
    // intercepts window-open requests for http(s) URLs and routes
    // them to the OS default browser via shell.openExternal(), always
    // denying the webview itself from navigating or opening a tab.
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, function (_, text, url) {
      return stash('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + text + "</a>");
    });

    // Bare URLs not already captured above, with trailing punctuation
    // (closing parens/quotes, sentence-ending periods) kept outside
    // the link.
    s = s.replace(/https?:\/\/[^\s<]+/g, function (m) {
      var trail = "";
      while (/[.,;:!?)'"]$/.test(m)) {
        trail = m.slice(-1) + trail;
        m = m.slice(0, -1);
      }
      if (!m) return m + trail;
      return stash('<a href="' + m + '" target="_blank" rel="noopener noreferrer">' + m + "</a>") + trail;
    });

    // Bold, then italic (bold consumes ** pairs first so italic's
    // single-* pattern can't split them apart).
    s = s.replace(/\*\*([^\n*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^\n*]+)\*(?!\*)/g, "$1<em>$2</em>");

    var restoreRe = new RegExp(PLACEHOLDER_MARK + "(\\d+)" + PLACEHOLDER_MARK, "g");
    s = s.replace(restoreRe, function (_, i) {
      return placeholders[i];
    });

    return s;
  }

  function addRow(ev) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    var row = document.createElement("div");
    row.className = "row " + ev.speaker;

    var tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = tagFor(ev.speaker);

    var text = document.createElement("div");
    text.className = "text";
    text.innerHTML = markdownToHtml(ev.text);

    row.appendChild(tag);
    row.appendChild(text);
    logEl.appendChild(row);
  }

  function poll() {
    fetch("/api/transcript?since=" + since + "&source=" + POLL_SOURCE)
      .then(function (r) {
        if (!r.ok) throw new Error("bad status " + r.status);
        return r.json();
      })
      .then(function (data) {
        // The idle placeholder (launcher.py, running whenever no call
        // is active) answers {"idle": true} with no "boot" field at
        // all -- check this BEFORE the boot-mismatch comparison below,
        // since undefined !== a real bootId would otherwise look like
        // a mismatch and wipe the view for no reason.
        if (data.idle) return data;
        if (bootId !== null && data.boot !== bootId) {
          // backtalk restarted since our last poll (a crash, a
          // relaunch, or a fresh call after being idle): our cursor
          // and everything on screen belongs to a process that's
          // gone, and the new one's ids start back at 1, which our
          // old cursor is already past. Wipe the view and pull this
          // process's real history from the start, rather than
          // silently polling forever and never showing anything new.
          resetLog();
          since = 0;
          return fetch("/api/transcript?since=0")
            .then(function (r2) { return r2.json(); });
        }
        return data;
      })
      .then(function (data) {
        dotEl.className = "ok";
        if (data.idle) {
          showIdleView();
          if (data.launch_failed && !lastReportedFailed) {
            lastReportedFailed = true;
            resetStartButton(
              "Start failed — check logs/launcher-launch.log for what happened.");
          } else if (startPending && startClickedAt !== null &&
                     Date.now() - startClickedAt > START_TIMEOUT_MS) {
            resetStartButton(
              "Timed out waiting for the call to start — try again.");
          }
          return;
        }
        showActiveView();
        bootId = data.boot;
        renderState(data.state);
        var events = data.events || [];
        for (var i = 0; i < events.length; i++) {
          addRow(events[i]);
          since = events[i].id;
        }
        if (events.length && pinnedToBottom) {
          logEl.scrollTop = logEl.scrollHeight;
        }
      })
      .catch(function () {
        dotEl.className = "bad";
      })
      .finally(function () {
        setTimeout(poll, 300);
      });
  }

  function postInput(text) {
    return fetch("/api/input", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text }),
    }).catch(function () {});
  }

  function send() {
    var text = inputEl.value.trim();
    if (!text) return;
    sendEl.disabled = true;
    postInput(text)
      .then(function () {
        inputEl.value = "";
        autoGrow();
      })
      .finally(function () {
        sendEl.disabled = false;
        inputEl.focus();
      });
  }

  // The model/effort/voice buttons in the settings menu send the exact
  // same phrases the voice console already recognizes ("switch to the
  // deep model", "switch voice to hal", etc.) through this same
  // typed-input path — no new backend logic, it's structurally
  // identical to typing the phrase yourself.
  var modelBtns = document.querySelectorAll(".model-btn");
  for (var m = 0; m < modelBtns.length; m++) {
    modelBtns[m].addEventListener("click", function () {
      var btn = this;
      postInput(btn.getAttribute("data-phrase")).finally(function () {
        btn.classList.add("sent");
        setTimeout(function () { btn.classList.remove("sent"); }, 900);
      });
    });
  }

  var TIER_LABEL = { fast: "Fast", deep: "Deep", cheap: "Cheap" };

  function renderState(state) {
    if (!state) return;
    var parts = [];
    if (state.tier) parts.push(TIER_LABEL[state.tier] || state.tier);
    if (state.model) parts.push(state.model);
    if (state.effort) parts.push(state.effort);
    statusPill.textContent = parts.length ? parts.join(" · ") : "—";

    for (var i = 0; i < modelBtns.length; i++) {
      var btn = modelBtns[i];
      var isActive;
      if (btn.hasAttribute("data-tier")) {
        isActive = btn.getAttribute("data-tier") === state.tier;
      } else if (btn.hasAttribute("data-effort")) {
        isActive = btn.getAttribute("data-effort") === state.effort;
      } else if (btn.hasAttribute("data-engine")) {
        isActive = btn.getAttribute("data-engine") === (state.voice_mode || "cartesia");
      } else {
        isActive = btn.getAttribute("data-voice") === state.voice;
      }
      btn.classList.toggle("active", isActive);
    }

    // Don't fight a click in progress: only sync from server state
    // when the toggle isn't the thing the user is actively touching.
    if (document.activeElement !== autoApproveToggle) {
      autoApproveToggle.checked = !!state.auto_approve;
    }
    if (document.activeElement !== volumeSlider && state.volume != null) {
      volumeSlider.value = state.volume;
      volumeValue.textContent = state.volume + "%";
    }
  }

  // The voice/text version of this is deliberately two steps ("stop
  // asking for permission", then a separate "confirm") -- that
  // friction exists to guard against a MISHEARD phrase silently
  // turning off safety checks. A UI toggle click has no equivalent
  // misfire risk, so it sends both steps back to back instead of
  // making you click twice. typed_q is a strict FIFO processed one
  // item at a time (see handle()), so the order is guaranteed even
  // sent this close together.
  autoApproveToggle.addEventListener("change", function () {
    if (autoApproveToggle.checked) {
      postInput("stop asking for permission").then(function () {
        return postInput("confirm");
      });
    } else {
      postInput("start asking again");
    }
  });

  // "input" fires continuously while dragging -- update the live label
  // only, no network call per pixel. "change" fires once on release,
  // which is when the actual phrase goes out, same as every other
  // settings-panel control.
  volumeSlider.addEventListener("input", function () {
    volumeValue.textContent = volumeSlider.value + "%";
  });
  volumeSlider.addEventListener("change", function () {
    postInput("set volume to " + volumeSlider.value);
  });

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  }

  sendEl.addEventListener("click", send);
  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  poll();
})();
</script>
</body>
</html>
