<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backtalk — transcript</title>
<style>
  :root {
    --page-plane:     #0d0d0d;
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:         rgba(255,255,255,0.10);

    --you-bubble:     #232322;
    --you-border:     rgba(255,255,255,0.14);
    --samantha-bubble: #16232f;
    --samantha-border: #3987e5;
    --samantha-text:   #7fb4f2;

    --ok:   #199e70;
    --bad:  #e66767;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--page-plane);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  body {
    display: flex; flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-1);
  }
  header h1 {
    font-size: 14px; font-weight: 600; margin: 0;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    flex: 0 0 auto;
    transition: background 200ms ease;
  }
  #dot.ok { background: var(--ok); }
  #dot.bad { background: var(--bad); }

  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 18px 18px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; }
  .row.you { justify-content: flex-end; }
  .row.samantha { justify-content: flex-start; }

  .bubble {
    max-width: min(640px, 78%);
    padding: 9px 13px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    border: 1px solid transparent;
  }
  .you .bubble {
    background: var(--you-bubble);
    border-color: var(--you-border);
    color: var(--text-primary);
    border-bottom-right-radius: 3px;
  }
  .samantha .bubble {
    background: var(--samantha-bubble);
    border-color: var(--samantha-border);
    color: var(--samantha-text);
    border-bottom-left-radius: 3px;
  }
  .label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 2px 3px;
  }
  .row.you .label { text-align: right; }
  .col { display: flex; flex-direction: column; max-width: min(640px, 78%); }
  .row.you .col { align-items: flex-end; }
  .row.samantha .col { align-items: flex-start; }

  #empty {
    margin: auto;
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
  }

  footer {
    flex: 0 0 auto;
    display: flex; gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface-1);
  }
  #input {
    flex: 1 1 auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14.5px;
    font-family: inherit;
    padding: 10px 12px;
    resize: none;
    outline: none;
  }
  #input:focus { border-color: var(--samantha-border); }
  #send {
    flex: 0 0 auto;
    background: var(--samantha-border);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  #send:hover:not(:disabled) { filter: brightness(1.1); }
</style>
</head>
<body>
  <header>
    <span id="dot"></span>
    <h1>backtalk transcript</h1>
  </header>

  <div id="log"><div id="empty">Waiting for the conversation to start…</div></div>

  <footer>
    <textarea id="input" rows="1" placeholder="Type a message — same as speaking"></textarea>
    <button id="send">Send</button>
  </footer>

<script>
(function () {
  "use strict";
  var logEl = document.getElementById("log");
  var emptyEl = document.getElementById("empty");
  var dotEl = document.getElementById("dot");
  var inputEl = document.getElementById("input");
  var sendEl = document.getElementById("send");

  var since = 0;
  var bootId = null;
  var pinnedToBottom = true;

  function resetLog() {
    logEl.innerHTML = "";
    emptyEl = document.createElement("div");
    emptyEl.id = "empty";
    emptyEl.textContent = "Waiting for the conversation to start…";
    logEl.appendChild(emptyEl);
  }

  logEl.addEventListener("scroll", function () {
    var gap = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight;
    pinnedToBottom = gap < 40;
  });

  function labelFor(speaker) {
    return speaker === "you" ? "You" : "Samantha";
  }

  function addRow(ev) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    var row = document.createElement("div");
    row.className = "row " + ev.speaker;
    var col = document.createElement("div");
    col.className = "col";
    var label = document.createElement("div");
    label.className = "label";
    label.textContent = labelFor(ev.speaker);
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = ev.text;
    col.appendChild(label);
    col.appendChild(bubble);
    row.appendChild(col);
    logEl.appendChild(row);
  }

  function poll() {
    fetch("/api/transcript?since=" + since)
      .then(function (r) {
        if (!r.ok) throw new Error("bad status " + r.status);
        return r.json();
      })
      .then(function (data) {
        if (bootId !== null && data.boot !== bootId) {
          // backtalk restarted since our last poll (a crash, a
          // relaunch): our cursor and everything on screen belongs to
          // a process that's gone, and the new one's ids start back
          // at 1, which our old cursor is already past. Wipe the view
          // and pull this process's real history from the start,
          // rather than silently polling forever and never showing
          // anything new.
          resetLog();
          since = 0;
          return fetch("/api/transcript?since=0")
            .then(function (r2) { return r2.json(); });
        }
        return data;
      })
      .then(function (data) {
        dotEl.className = "ok";
        bootId = data.boot;
        var events = data.events || [];
        for (var i = 0; i < events.length; i++) {
          addRow(events[i]);
          since = events[i].id;
        }
        if (events.length && pinnedToBottom) {
          logEl.scrollTop = logEl.scrollHeight;
        }
      })
      .catch(function () {
        dotEl.className = "bad";
      })
      .finally(function () {
        setTimeout(poll, 300);
      });
  }

  function send() {
    var text = inputEl.value.trim();
    if (!text) return;
    sendEl.disabled = true;
    fetch("/api/input", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text }),
    })
      .then(function () {
        inputEl.value = "";
        autoGrow();
      })
      .catch(function () {})
      .finally(function () {
        sendEl.disabled = false;
        inputEl.focus();
      });
  }

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  }

  sendEl.addEventListener("click", send);
  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  poll();
})();
</script>
</body>
</html>
