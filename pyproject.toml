[project]
name = "backtalk"
version = "1.0.0"
description = "Talk to your Claude Code agent out loud. Hold a key, speak, and it answers in a real voice."
requires-python = ">=3.10,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.100",
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "kokoro>=0.9.0",
    "numpy>=1.26.0",
    "pynput>=1.8.0",
    "setuptools<81",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "webrtcvad>=2.0.10",
]

[tool.uv]
package = false
